<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>An Apology</title>
<style>
  :root {
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "San Francisco", "Helvetica Neue", Helvetica, Roboto, "Segoe UI", Arial, sans-serif;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --blue: #0071e3;
    --pink: #ff2d55;
    --blob1: #bcd7ff;
    --blob2: #d9c8ff;
    --blob3: #c9f0ff;
    --bg: #f5f5f7;
  }
  body.forgiven {
    --blob1: #ffc2d4;
    --blob2: #ffd9b8;
    --blob3: #f2c6ff;
    --bg: #fff4f7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    transition: background-color 1.4s ease;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ---------- Ambient mesh background ---------- */
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
  .blob {
    position: absolute;
    width: 52vmax; height: 52vmax;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .85;
    transition: background-color 1.6s ease;
    will-change: transform;
  }
  .blob.b1 { background: var(--blob1); top: -15vmax; left: -10vmax; animation: float1 22s ease-in-out infinite; }
  .blob.b2 { background: var(--blob2); bottom: -20vmax; right: -12vmax; animation: float2 28s ease-in-out infinite; }
  .blob.b3 { background: var(--blob3); top: 30%; left: 40%; width: 36vmax; height: 36vmax; animation: float3 25s ease-in-out infinite; }
  @keyframes float1 { 50% { transform: translate(12vmax, 10vmax) scale(1.1); } }
  @keyframes float2 { 50% { transform: translate(-14vmax, -8vmax) scale(1.15); } }
  @keyframes float3 { 50% { transform: translate(-10vmax, 12vmax) scale(.9); } }
  .parallax { position: absolute; inset: 0; transition: transform .6s cubic-bezier(.2,.8,.2,1); }

  /* ---------- Glass ---------- */
  .glass {
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, rgba(255,255,255,.62), rgba(255,255,255,.30));
    -webkit-backdrop-filter: blur(32px) saturate(180%);
    backdrop-filter: blur(32px) saturate(180%);
    border: 1px solid rgba(255,255,255,.65);
    border-radius: 2rem;
    box-shadow:
      0 20px 50px rgba(30, 40, 90, .10),
      0 2px 6px rgba(30, 40, 90, .05),
      inset 0 1px 0 rgba(255,255,255,.9),
      inset 0 0 0 1px rgba(255,255,255,.25);
    transform: perspective(1000px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) scale(var(--s, 1));
    transition: transform .25s ease-out, opacity .9s ease;
  }
  .glass::before { /* specular highlight following the cursor */
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(circle at var(--mx, 50%) var(--my, 0%), rgba(255,255,255,.75), transparent 55%);
    opacity: .55;
    pointer-events: none;
    transition: opacity .3s;
  }
  .glass > * { position: relative; z-index: 1; }

  /* ---------- Stages ---------- */
  .stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 1.5rem;
    z-index: 10;
    opacity: 0; pointer-events: none;
    transition: opacity .8s ease;
  }
  .stage.active { opacity: 1; pointer-events: auto; }

  .card { width: min(92vw, 640px); padding: clamp(2rem, 6vw, 3.5rem); text-align: center; }
  .eyebrow {
    display: inline-block;
    font-size: .8rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted);
    padding: .35rem .9rem;
    border-radius: 999px;
    background: rgba(255,255,255,.55);
    border: 1px solid rgba(255,255,255,.7);
    margin-bottom: 1.6rem;
  }
  .line {
    font-size: clamp(1.5rem, 4.6vw, 2.4rem);
    font-weight: 600; letter-spacing: -.02em; line-height: 1.2;
    margin-bottom: .7rem;
    opacity: 0; transform: translateY(14px); filter: blur(8px);
    transition: opacity .9s ease, transform .9s cubic-bezier(.22,1,.36,1), filter .9s ease;
  }
  .line.show { opacity: 1; transform: none; filter: none; }
  .line.soft { font-weight: 500; color: var(--muted); font-size: clamp(1.1rem, 3.2vw, 1.4rem); }

  .apple-tooltip {
  position: relative;
  display: inline-block;
  cursor: pointer;
  }
  
  .apple-tooltip-text {
  visibility: hidden;
  opacity: 0;
  position: absolute;
  bottom: 125%;
  left: 50%;
  transform: translateX(-50%) translateY(4px);
  width: max-content;
  max-width: 200px;
  padding: 6px 12px;

  /* Apple Glass / Frosted Effect */
  background: rgba(255, 255, 255, 0.75);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 0.5px solid rgba(255, 255, 255, 0.4);
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);

  color: #1d1d1f;
  font-size: 13px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  text-align: center;
  border-radius: 8px;
  z-index: 10;

  transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
  }
  
  .apple-tooltip:hover .apple-tooltip-text {
  visibility: visible;
  opacity: 1;
  transform: translateX(-50%) translateY(0);
  }

  #question {
    margin-top: 1.6rem;
    opacity: 0; transform: translateY(14px);
    transition: opacity .9s ease, transform .9s cubic-bezier(.22,1,.36,1);
    pointer-events: none;
  }
  #question.show { opacity: 1; transform: none; pointer-events: auto; }
  #question h2 { font-size: clamp(1.25rem, 3.6vw, 1.7rem); font-weight: 600; letter-spacing: -.015em; margin-bottom: 1.6rem; }

  .btn-row { display: flex; gap: 1rem; align-items: center; justify-content: center; flex-wrap: wrap; min-height: 64px; }
  .btn {
    font-family: inherit; font-size: 1.05rem; font-weight: 600;
    border: 0; border-radius: 999px; cursor: pointer;
    padding: .95rem 2.4rem;
    transition: transform .25s cubic-bezier(.22,1,.36,1), background-color .2s, box-shadow .2s;
  }
  .btn:focus-visible { outline: 3px solid rgba(0,113,227,.45); outline-offset: 3px; }
  #btn-yes {
    background: linear-gradient(180deg, #2a8cff, var(--blue));
    color: #fff;
    box-shadow: 0 8px 22px rgba(0,113,227,.35), inset 0 1px 0 rgba(255,255,255,.35);
    transform: scale(var(--yes, 1));
  }
  #btn-yes:hover { box-shadow: 0 10px 28px rgba(0,113,227,.5), inset 0 1px 0 rgba(255,255,255,.35); }
  #btn-yes:active { transform: scale(calc(var(--yes, 1) * .96)); }
  #btn-no {
    background: rgba(255,255,255,.7);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,.8);
    color: var(--text);
    box-shadow: 0 4px 14px rgba(0,0,0,.08);
    transform: scale(var(--no, 1));
  }
  #btn-no.floating {
    position: fixed; z-index: 60;
    transition: left .35s cubic-bezier(.25,1,.5,1), top .35s cubic-bezier(.25,1,.5,1), transform .3s, opacity .3s;
  }
  #hint { margin-top: 1.4rem; min-height: 1.4em; font-size: .98rem; color: var(--muted); transition: opacity .3s; }

  /* ---------- Final stage ---------- */
  #photos { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
  .tile {
    position: absolute; left: 0; top: 0;
    border-radius: 1.4rem;
    overflow: hidden;
    pointer-events: auto;
    cursor: grab;
    touch-action: none;
    opacity: 0;
    border: 1px solid rgba(255,255,255,.75);
    box-shadow: 0 14px 34px rgba(60, 30, 60, .16), inset 0 1px 0 rgba(255,255,255,.8);
    transition: opacity 1s ease, box-shadow .25s;
    will-change: transform;
  }
  .tile.drag { cursor: grabbing; box-shadow: 0 24px 50px rgba(60, 30, 60, .28); z-index: 3; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .tile .emoji {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.6rem;
    background: linear-gradient(135deg, rgba(255,255,255,.8), rgba(255,255,255,.35));
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  }

  #final { z-index: 20; pointer-events: none; }
  #final.active .card { pointer-events: auto; }
  #final .card { opacity: 0; --s: .94; }
  #final.active .card { opacity: 1; --s: 1; transition-delay: .2s; }
  .heart-icon { width: 4rem; height: 4rem; margin: 0 auto 1.2rem; color: var(--pink); filter: drop-shadow(0 6px 14px rgba(255,45,85,.35)); animation: beat 1.6s ease-in-out infinite; }
  @keyframes beat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.14); } 30% { transform: scale(1); } 45% { transform: scale(1.08); } }
  #final h2 { font-size: clamp(1.6rem, 5vw, 2.3rem); font-weight: 600; letter-spacing: -.02em; line-height: 1.2; }
  #final p { margin-top: .9rem; color: var(--muted); font-size: 1.05rem; line-height: 1.5; }

  /* Hold-to-hug */
  .hug-wrap { margin-top: 1.8rem; display: flex; flex-direction: column; align-items: center; gap: .6rem; }
  #hug {
    position: relative; width: 92px; height: 92px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.85);
    background: linear-gradient(135deg, rgba(255,255,255,.85), rgba(255,255,255,.4));
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    box-shadow: 0 10px 26px rgba(255,45,85,.18), inset 0 1px 0 #fff;
    font-size: 2rem; cursor: pointer;
    touch-action: none;
    transition: transform .2s;
  }
  #hug:active, #hug.holding { transform: scale(.94); }
  #hug:focus-visible { outline: 3px solid rgba(255,45,85,.4); outline-offset: 4px; }
  #hug svg { position: absolute; inset: -1px; width: calc(100% + 2px); height: calc(100% + 2px); transform: rotate(-90deg); pointer-events: none; }
  #hug circle { fill: none; stroke: var(--pink); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 289; stroke-dashoffset: 289; }
  #hug-label { font-size: .9rem; color: var(--muted); }
  .replay { margin-top: 1.4rem; font-size: .85rem; color: var(--muted); background: none; border: 0; cursor: pointer; font-family: inherit; text-decoration: underline; text-underline-offset: 3px; }

  /* Overlays */
  #confetti { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
  .rise {
    position: fixed; bottom: -40px; z-index: 4; pointer-events: none;
    animation: rise linear forwards;
    opacity: 0;
  }
  @keyframes rise {
    0% { transform: translateY(0) translateX(0) scale(.6); opacity: 0; }
    10% { opacity: .85; }
    100% { transform: translateY(-115vh) translateX(var(--dx, 0px)) scale(1.1); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .blob, .heart-icon { animation: none; }
    .line, #question { transition-duration: .01s; }
  }
</style>
</head>
<body>

<!-- Ambient background -->
<div class="bg" aria-hidden="true">
  <div class="parallax" id="parallax">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>
</div>

<!-- Stage 1: the apology + the question -->
<main id="ask" class="stage active">
  <section class="glass card" id="askCard">
    <span class="eyebrow">I hope this will make you smile.</span>
    <p class="line" data-line></p>
    <p class="line" data-line></p>
    <p class="line soft" data-line></p>

    <div id="question">
      <h2 id="questionText"></h2>
      <div class="btn-row" id="btnRow">
        <button id="btn-yes" class="btn">Yes</button>
        <button id="btn-no" class="btn">No</button>
      </div>
      <p id="hint" aria-live="polite"></p>
    </div>
  </section>
</main>

<!-- Stage 2: the resolution -->
<div id="photos" aria-hidden="true"></div>
<main id="final" class="stage">
  <section class="glass card" id="finalCard">
    <svg class="heart-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
    </svg>
    <h2 id="finalTitle"></h2>
    <p id="finalBody"></p>

    <div class="hug-wrap">
      <button id="hug" aria-label="Press and hold to send a hug">
        <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/></svg>
        🤗
      </button>
      <span id="hug-label">Press &amp; hold to send a hug</span>
    </div>
    <button class="replay" id="replay">Start over</button>
  </section>
</main>

<canvas id="confetti"></canvas>

<script>
/* =========================================================
   EDIT ME — personalise everything here
   ========================================================= */
const CONFIG = {
  introLines: [
    "Hey Milli.",
    "I've been thinking about what happened.",
    "I'm truly sorry, and I owe you a proper apology."
  ],
  question: "Can you please forgive me?",
  yesLabel: "Yes",
  noLabel: "No",
  // Add your own photos here (URLs or relative paths like "photos/us1.jpg").
  // Leave empty to use soft emoji tiles instead.
  photos: ["https://lh3.googleusercontent.com/pw/AP1GczOccho21N_sNi0NsEYmpbvxZZ7oCT97tpmAjzViHFO10CnDH_qkfvfGUvIXBs2tlCGg3cj9W5q0I7eHfisg6dRhJ3q78nx_SRwIisuPPiTScgC82skanJKEEqwYnXQFMU5al1ns36Jr-5DXHy7zi-NmRA=w591-h788-s-no",
  "https://lh3.googleusercontent.com/pw/AP1GczN-api81Az4pNDLeXRg3-UAolYH63jkddsLXrvedwArKsWljya6wg_aFu9umtiwrjitg0209utDR1376vTn66SV6jqbQGwFq9rtOEqf-EiU0pW22eGz2332_A-IU0ikVZSkYGB01VfTU6Jp2ObZHp5ASw=w591-h788-s-no",
  "https://lh3.googleusercontent.com/pw/AP1GczN7nk2vPz9z70WXIPMx9ctW4oz4hw9ZGqYUd2KTQWM1FclkJFaP3bFUKkwVBkUJUMkwFUBQF13Evotra4OXV_SRwapEctKL3_NYJxKkNTs-aBXAxWZBWGyWTZ_qHNpnQiU2CGY8YvU7ikPxKnjeA8SDdw=w591-h788-s-no",
  "https://lh3.googleusercontent.com/pw/AP1GczMvu8DIVr_Dhy5HHDAkafDnBWUE2xLGEm6kvcPas3gnvPv00rzlV9FZz1VoW0JGCTX9SQzvccx70PEv_LfQW_h2b_InNcBrYhXD29lkbS4z9DQ35Zm-hQ7AxtlW32XKj5e38pnyDKylp4xmRcHABYaxiA=w591-h788-s-no",
  "https://lh3.googleusercontent.com/pw/AP1GczOH65I07cyOkd0jBrMTgbY72Is1y40q5G-2ufBp5_fwVwEKTNxmgmZKlNNq_eO8moqgxBqVSrAuDUkBohR1cv1aYHibsIfklV1CPMOMwiEzOzvwusj5U-CH-s9ySV7cBWMJwNYgclkZRFVv9MGESdeMfQ=w1051-h788-s-no",
  "https://lh3.googleusercontent.com/pw/AP1GczM2zemMMAQSYEKF_bCqvCuiasjZJB4VVX-mDpzlZPrXDYcn7dL26_V3UDjrtluTXtAYK_c7Q0MKNpuBkTqrrlhzAbJw5XVVGR_i3ewhVopnpiyq3Mlkl3cDaRgEDLslf0ijunceFFJe0uecsEbupToqRg=w591-h788-s-no",
  "https://lh3.googleusercontent.com/pw/AP1GczNqluDXQNks6pZ79AMmUmype8-vJ3p_u04qL-PEqo6kIIjbFweVYPefF-P4CY5urL1ZSsZdIi4VvE2uqlXn-58JTKqSQELorEQMtvLC6a00PWE-9TKkwLzgPGA-STV6MUWTpznss4jVOQH4UTacDDXlow=w591-h788-s-no",
  "https://lh3.googleusercontent.com/pw/AP1GczP_tvzdcuTLX7mn6BMw3XRiFSMNdMm6YmyfaMN_bUrf3RHbG4dt9g3ezN7BWUlhATsa5YFXu9L9XBV108uOvK8iA78eAyTW2DzX5Q0m_BWdnmxLPpRSK3yKtN2A8bx8Nkh7mc3LOSNRfauh0OnadB5P9Q=w591-h788-s-no", 
  "https://lh3.googleusercontent.com/pw/AP1GczOG6bcxLNQDejQ7vIQdEfcJoYhvG6aA3Y-jDqRRltI7LzM3WFOfQ-FeemGK11MJS2BeYAdVaLvWOuJJNoQQ7chzeONJ2XrzCi-OjA6CgAO1lAASCXwxty94APLUNRmYLpzLCuYfEjltGYwptQ1eMUktCg=w591-h788-s-no",
  "https://lh3.googleusercontent.com/pw/AP1GczPQO6iJ8t7p93saKYUM1pjNEAG14mfFwXQoeKNeMlQfbcWZ7Wvl0yf2mmRUxZYw-Xk4vniVcsZV4-enG_w1a5KLXZ-DcQafpbf8mxoNSJgUhbqkHVi_f1RG0eer-YcdUhK0h1xdayNAGMlaV-B5xzFNHQ=w591-h788-s-no"],
  emojis: ["💖","🌸","✨","🕊️","🌷","🫶","💫","🍃","🌙","💐"],
  // Messages shown as NO keeps running away (cycled in order)
  noHints: [
    "Hmm, that button seems shy…",
    "Oops, missed it.",
    "Are you sure? Take a moment.",
    "It really doesn't want to be clicked 🥺",
    "I'm trying my best here.",
    "The Yes button is looking pretty good, right?",
    "Please? I mean it, I'm sorry.",
    "Okay now you're just chasing it 😅",
    "I promise I'll do better."
  ],
  finalTitle: "Thank you for your kind-hearted gesture.",
  finalBody: "It means more than I can say. I'll make it up to you.",
  hugDoneLabel: "Hug delivered 🤗💖"
};

/* =========================================================
   Helpers
   ========================================================= */
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const buzz = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
const rand = (a, b) => Math.random() * (b - a) + a;

/* =========================================================
   Intro sequence
   ========================================================= */
const lineEls = $$('[data-line]');
lineEls.forEach((el, i) => el.textContent = CONFIG.introLines[i] || '');
$('#questionText').textContent = CONFIG.question;
$('#btn-yes').textContent = CONFIG.yesLabel;
$('#btn-no').textContent = CONFIG.noLabel;
$('#finalTitle').textContent = CONFIG.finalTitle;
$('#finalBody').textContent = CONFIG.finalBody;

let introTimers = [];
function playIntro() {
  introTimers.forEach(clearTimeout);
  introTimers = [];
  lineEls.forEach((el) => el.classList.remove('show'));
  $('#question').classList.remove('show');
  lineEls.forEach((el, i) => introTimers.push(setTimeout(() => el.classList.add('show'), 500 + i * 1100)));
  introTimers.push(setTimeout(() => $('#question').classList.add('show'), 500 + lineEls.length * 1100 + 200));
}
playIntro();

/* =========================================================
   Glass tilt + specular highlight + background parallax
   ========================================================= */
$$('.glass').forEach((card) => {
  card.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'touch') return;
    const r = card.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width;
    const py = (e.clientY - r.top) / r.height;
    card.style.setProperty('--mx', (px * 100) + '%');
    card.style.setProperty('--my', (py * 100) + '%');
    if (!reduceMotion) {
      card.style.setProperty('--ry', ((px - .5) * 7) + 'deg');
      card.style.setProperty('--rx', ((.5 - py) * 7) + 'deg');
    }
  });
  card.addEventListener('pointerleave', () => {
    card.style.setProperty('--rx', '0deg');
    card.style.setProperty('--ry', '0deg');
  });
});

document.addEventListener('pointermove', (e) => {
  if (reduceMotion) return;
  const x = (e.clientX / innerWidth - .5) * 40;
  const y = (e.clientY / innerHeight - .5) * 40;
  $('#parallax').style.transform = `translate(${x}px, ${y}px)`;
});

/* =========================================================
   The evasive NO button
   ========================================================= */
const btnYes = $('#btn-yes');
const btnNo = $('#btn-no');
const hint = $('#hint');
let evasions = 0;
let noFloating = false;
let pointer = { x: -999, y: -999 };

function detachNo() {
  if (noFloating) return;
  const r = btnNo.getBoundingClientRect();
  // keep the row from collapsing when NO leaves the layout
  const ph = document.createElement('span');
  ph.style.cssText = `display:inline-block;width:${r.width}px;height:${r.height}px;`;
  btnNo.parentNode.insertBefore(ph, btnNo);
  document.body.appendChild(btnNo); // body = not inside a transformed glass card
  btnNo.classList.add('floating');
  btnNo.style.left = r.left + 'px';
  btnNo.style.top = r.top + 'px';
  noFloating = true;
}

function evade() {
  detachNo();
  const bw = btnNo.offsetWidth, bh = btnNo.offsetHeight;
  const pad = 16;
  const maxX = innerWidth - bw - pad;
  const maxY = innerHeight - bh - pad;
  const yesR = btnYes.getBoundingClientRect();
  let best = null, bestScore = -1;

  // try several candidates; keep the one farthest from cursor, not on top of YES
  for (let i = 0; i < 25; i++) {
    const x = rand(pad, Math.max(pad, maxX));
    const y = rand(pad, Math.max(pad, maxY));
    const cx = x + bw / 2, cy = y + bh / 2;
    const dPointer = Math.hypot(cx - pointer.x, cy - pointer.y);
    const overlapsYes = !(x > yesR.right + 20 || x + bw < yesR.left - 20 || y > yesR.bottom + 20 || y + bh < yesR.top - 20);
    if (overlapsYes) continue;
    if (dPointer > bestScore) { bestScore = dPointer; best = { x, y }; }
  }
  if (!best) best = { x: rand(pad, maxX), y: rand(pad, maxY) };
  btnNo.style.left = best.x + 'px';
  btnNo.style.top = best.y + 'px';

  evasions++;
  // YES grows, NO shrinks a little each time
  const yesScale = Math.min(1 + evasions * 0.07, 1.7);
  const noScale = Math.max(1 - evasions * 0.04, .6);
  btnYes.style.setProperty('--yes', yesScale);
  btnNo.style.setProperty('--no', noScale);

  hint.textContent = CONFIG.noHints[(evasions - 1) % CONFIG.noHints.length];
  buzz(15);
}

document.addEventListener('pointermove', (e) => {
  pointer.x = e.clientX; pointer.y = e.clientY;
  if (!$('#question').classList.contains('show') || $('#ask').classList.contains('done')) return;
  const r = btnNo.getBoundingClientRect();
  const d = Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
  const threshold = Math.max(r.width, r.height) / 2 + 55;
  if (d < threshold) evade();
});
btnNo.addEventListener('pointerdown', (e) => { e.preventDefault(); pointer = { x: e.clientX, y: e.clientY }; evade(); });
btnNo.addEventListener('click', (e) => { e.preventDefault(); evade(); });
btnNo.addEventListener('focus', evade); // keyboard users can't catch it either, they'll find YES

/* =========================================================
   YES → celebration
   ========================================================= */
btnYes.addEventListener('click', forgive);

function forgive() {
  const askStage = $('#ask');
  askStage.classList.add('done');
  askStage.classList.remove('active');
  btnNo.style.opacity = '0';
  btnNo.style.pointerEvents = 'none';
  setTimeout(() => btnNo.remove(), 400);
  buzz([30, 50, 30]);

  document.body.classList.add('forgiven');
  setTimeout(() => {
    $('#final').classList.add('active');
    spawnTiles();
    burst(innerWidth / 2, innerHeight / 2, 140);
    startRisingHearts();
  }, 500);
}

/* =========================================================
   Confetti (hearts + sparkles) on canvas
   ========================================================= */
const cvs = $('#confetti');
const ctx = cvs.getContext('2d');
let particles = [];
let rafConf = null;
function sizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  cvs.width = innerWidth * dpr; cvs.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
sizeCanvas();
addEventListener('resize', sizeCanvas);

const PARTS = ["💖","💗","💕","✨","🌸","💫","🤍"];
function burst(x, y, n) {
  if (reduceMotion) n = Math.min(n, 30);
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(4, 13);
    particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - rand(2, 6),
      g: rand(.18, .3), life: 1, decay: rand(.006, .014),
      size: rand(14, 30), rot: rand(0, 6.28), vr: rand(-.2, .2),
      ch: PARTS[Math.floor(rand(0, PARTS.length))]
    });
  }
  if (!rafConf) rafConf = requestAnimationFrame(stepConfetti);
}
function stepConfetti() {
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  particles = particles.filter(p => p.life > 0 && p.y < innerHeight + 60);
  for (const p of particles) {
    p.vx *= .985; p.vy += p.g;
    p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= p.decay;
    ctx.save();
    ctx.globalAlpha = Math.max(p.life, 0);
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.font = p.size + 'px serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(p.ch, 0, 0);
    ctx.restore();
  }
  if (particles.length) rafConf = requestAnimationFrame(stepConfetti);
  else { rafConf = null; ctx.clearRect(0, 0, innerWidth, innerHeight); }
}
// tap anywhere on the final screen for a little burst
document.addEventListener('pointerdown', (e) => {
  if (!$('#final').classList.contains('active')) return;
  if (e.target.closest('#hug, .replay, .tile')) return;
  burst(e.clientX, e.clientY, 22);
});

/* =========================================================
   Rising hearts (ambient)
   ========================================================= */
let riseTimer = null;
function startRisingHearts() {
  if (reduceMotion) return;
  clearInterval(riseTimer);
  riseTimer = setInterval(() => {
    const el = document.createElement('div');
    el.className = 'rise';
    el.textContent = ["💗","🤍","💕","✨"][Math.floor(rand(0, 4))];
    el.style.left = rand(2, 96) + 'vw';
    el.style.fontSize = rand(14, 28) + 'px';
    el.style.setProperty('--dx', rand(-60, 60) + 'px');
    const d = rand(7, 13);
    el.style.animationDuration = d + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), d * 1000);
  }, 650);
}

/* =========================================================
   Draggable, floating photo / emoji tiles
   ========================================================= */
let tiles = [];
let rafTiles = null;

function spawnTiles() {
  const box = $('#photos');
  box.innerHTML = '';
  tiles = [];
  const items = CONFIG.photos.length ? CONFIG.photos : CONFIG.emojis;
  const isPhoto = CONFIG.photos.length > 0;
  const count = Math.max(items.length, 8);

  for (let i = 0; i < count; i++) {
    const src = items[i % items.length];
    const el = document.createElement('div');
    el.className = 'tile';
    const size = Math.floor(rand(92, 150));
    el.style.width = el.style.height = size + 'px';

    const fallbackEmoji = () => {
      el.innerHTML = '';
      const d = document.createElement('div');
      d.className = 'emoji';
      d.textContent = CONFIG.emojis[i % CONFIG.emojis.length];
      el.appendChild(d);
    };
    if (isPhoto) {
      const img = new Image();
      img.alt = '';
      img.onerror = fallbackEmoji;
      img.src = src;
      el.appendChild(img);
    } else {
      const d = document.createElement('div');
      d.className = 'emoji';
      d.textContent = src;
      el.appendChild(d);
    }
    box.appendChild(el);

    const t = {
      el, size,
      x: rand(10, Math.max(20, innerWidth - size - 10)),
      y: rand(10, Math.max(20, innerHeight - size - 10)),
      vx: rand(-.35, .35), vy: rand(-.35, .35),
      rot: rand(-10, 10), vr: rand(-.05, .05),
      dragging: false, depth: rand(.5, 1.2)
    };
    tiles.push(t);
    enableDrag(t);
    setTimeout(() => el.style.opacity = rand(.65, .95).toString(), 150 + i * 120);
  }
  if (!rafTiles) rafTiles = requestAnimationFrame(stepTiles);
}

function enableDrag(t) {
  let ox = 0, oy = 0, last = null;
  t.el.addEventListener('pointerdown', (e) => {
    t.dragging = true; t.el.classList.add('drag');
    t.el.setPointerCapture(e.pointerId);
    ox = e.clientX - t.x; oy = e.clientY - t.y;
    last = { x: e.clientX, y: e.clientY, t: performance.now() };
    t.vx = t.vy = 0;
  });
  t.el.addEventListener('pointermove', (e) => {
    if (!t.dragging) return;
    t.x = e.clientX - ox; t.y = e.clientY - oy;
    const now = performance.now(), dt = Math.max(now - last.t, 1);
    t.vx = (e.clientX - last.x) / dt * 16;
    t.vy = (e.clientY - last.y) / dt * 16;
    last = { x: e.clientX, y: e.clientY, t: now };
  });
  const end = () => {
    if (!t.dragging) return;
    t.dragging = false; t.el.classList.remove('drag');
    t.vx = Math.max(-14, Math.min(14, t.vx));
    t.vy = Math.max(-14, Math.min(14, t.vy));
  };
  t.el.addEventListener('pointerup', end);
  t.el.addEventListener('pointercancel', end);
}

function stepTiles() {
  const W = innerWidth, H = innerHeight;
  for (const t of tiles) {
    if (!t.dragging) {
      // gentle drift + friction toward a slow cruising speed
      t.x += t.vx * t.depth; t.y += t.vy * t.depth; t.rot += t.vr;
      const sp = Math.hypot(t.vx, t.vy);
      if (sp > .5) { t.vx *= .985; t.vy *= .985; }
      if (t.x < 0) { t.x = 0; t.vx = Math.abs(t.vx); }
      if (t.y < 0) { t.y = 0; t.vy = Math.abs(t.vy); }
      if (t.x > W - t.size) { t.x = W - t.size; t.vx = -Math.abs(t.vx); }
      if (t.y > H - t.size) { t.y = H - t.size; t.vy = -Math.abs(t.vy); }
      if (sp < .12) { t.vx += rand(-.05, .05); t.vy += rand(-.05, .05); }
    }
    const tilt = t.dragging ? t.vx * .8 : t.rot;
    t.el.style.transform = `translate3d(${t.x}px, ${t.y}px, 0) rotate(${tilt}deg) scale(${t.dragging ? 1.08 : 1})`;
  }
  rafTiles = requestAnimationFrame(stepTiles);
}

/* =========================================================
   Press & hold to send a hug
   ========================================================= */
const hug = $('#hug');
const ring = hug.querySelector('circle');
const hugLabel = $('#hug-label');
const HOLD_MS = 1600;
let holdStart = null, holdRaf = null, hugDone = false;

function holdTick() {
  const p = Math.min((performance.now() - holdStart) / HOLD_MS, 1);
  ring.style.strokeDashoffset = 289 * (1 - p);
  if (p % .25 < .02) buzz(8);
  if (p >= 1) return completeHug();
  holdRaf = requestAnimationFrame(holdTick);
}
function startHold(e) {
  if (hugDone) return;
  if (e && e.preventDefault) e.preventDefault();
  hug.classList.add('holding');
  hugLabel.textContent = 'Hold on…';
  holdStart = performance.now();
  cancelAnimationFrame(holdRaf);
  holdRaf = requestAnimationFrame(holdTick);
}
function cancelHold() {
  if (hugDone || holdStart === null) return;
  cancelAnimationFrame(holdRaf);
  holdStart = null;
  hug.classList.remove('holding');
  ring.style.transition = 'stroke-dashoffset .4s ease';
  ring.style.strokeDashoffset = 289;
  setTimeout(() => ring.style.transition = '', 450);
  hugLabel.textContent = 'Press & hold to send a hug';
}
function completeHug() {
  hugDone = true;
  hug.classList.remove('holding');
  hugLabel.textContent = CONFIG.hugDoneLabel;
  const r = hug.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2, 120);
  setTimeout(() => burst(innerWidth * .25, innerHeight * .6, 50), 250);
  setTimeout(() => burst(innerWidth * .75, innerHeight * .6, 50), 450);
  buzz([40, 40, 80]);
}
hug.addEventListener('pointerdown', startHold);
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => hug.addEventListener(ev, cancelHold));
hug.addEventListener('keydown', (e) => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) startHold(e); });
hug.addEventListener('keyup', (e) => { if (e.key === ' ' || e.key === 'Enter') cancelHold(); });

/* =========================================================
   Start over (handy while you're testing)
   ========================================================= */
$('#replay').addEventListener('click', () => location.reload());
</script>
